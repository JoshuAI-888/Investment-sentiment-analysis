# Manual database operations against a real deployment — DEPLOY.md MT-08's first two steps.
#
# **Why a workflow rather than a script someone runs locally.** `pnpm migrate` and
# `pnpm seed:universe` need `DATABASE_URL` and nothing else, but they cannot run from Vercel:
# a build runs before the deployment exists and a serverless function is the wrong place to
# apply DDL. That leaves someone's laptop, which means the schema of record depends on who ran
# what and when. Here every run is logged, attributed and repeatable.
#
# **`workflow_dispatch` only — never on push.** A migration that runs automatically is a
# migration that runs during an unrelated deploy, and under D-17's permanent corpus there is no
# clean rollback from a half-applied schema. Someone decides to run this, every time.
#
# This file is `.github/workflows/`, which F01 §4.4b owns — added by the coordinator as a deploy
# operation rather than by a lane, per CLAUDE.md's rule that a lane never writes a workflow.
name: Database

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to run'
        required: true
        type: choice
        # `migrate-then-seed-all` is the default because the first real run of this workflow
        # left the dropdown on `migrate` and silently half-provisioned the database: the schema
        # applied, the universe never seeded, and the run still reported success because a
        # skipped step is a successful one. Every operation here is idempotent — migrate reports
        # already-applied files as skipped, seed:universe refuses to resurrect an
        # administrator-removed symbol, and seed:jobs is `on conflict (job_key) do nothing` — so
        # defaulting to the complete operation is safe, and it is the one people actually want.
        default: migrate-then-seed-all
        options:
          - migrate
          - seed-securities
          - seed-universe
          - seed-jobs
          - migrate-then-seed-all
      environment:
        description: 'APP_ENVIRONMENT for the universe seed (its version rows are scoped to this)'
        required: true
        type: choice
        default: production
        options:
          - production
          - preview

permissions:
  contents: read

# Two concurrent migrations against one database is the one thing this must never allow.
# No `cancel-in-progress`: cancelling a run mid-DDL is how a schema ends up half-applied.
concurrency:
  group: database-${{ github.ref }}

jobs:
  run:
    name: ${{ inputs.operation }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Requires a `database` environment in repo settings holding DATABASE_URL. Beyond keeping
    # the secret out of the default scope, an environment can carry required reviewers — which
    # is the mechanism to reach for if this should ever need a second pair of eyes.
    environment: database

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # These scripts touch the database and no provider. Fixture mode keeps it that way, and
      # keeps this workflow honest about needing exactly one secret.
      PROVIDER_MODE: fixture

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fail early if the secret is absent
        # Without this the failure surfaces as a connection error inside a script, which reads
        # like a database problem rather than a missing-secret one.
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set. Add it to the 'database' environment in"
            echo "::error::Settings -> Environments -> database -> Environment secrets."
            echo "::error::Use Neon's POOLED connection string (its hostname contains '-pooler')."
            exit 1
          fi

      - name: Migrate
        if: inputs.operation == 'migrate' || inputs.operation == 'migrate-then-seed-all'
        working-directory: apps/web
        # Idempotent: already-applied migrations are reported as skipped, not reapplied.
        run: pnpm migrate

      - name: Seed securities
        if: inputs.operation == 'seed-securities' || inputs.operation == 'migrate-then-seed-all'
        working-directory: apps/web
        # Must precede the universe seed, which resolves every seeded symbol against `security`
        # and refuses the whole seed if one is missing. Nothing else in the product writes to
        # that table, so on a fresh database this step is the difference between the universe
        # seeding and failing with all 100 symbols reported missing.
        #
        # This is the only step here that calls a provider, hence the extra secret. It exits 3
        # if FMP cannot resolve some symbol, which fails the run deliberately: those are universe
        # members with no company behind them, and dropping them quietly would change a frozen
        # methodological commitment (D-27, D-30) without anyone deciding to.
        env:
          PROVIDER_MODE: live
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: pnpm seed:securities

      - name: Seed job definitions
        if: inputs.operation == 'seed-jobs' || inputs.operation == 'migrate-then-seed-all'
        working-directory: apps/web
        # Without these rows the dispatcher claims an empty set every five minutes: F16a is live
        # and idle, which looks identical to healthy from the outside and is exactly what the
        # heartbeat exists to catch. This workflow predates F16a and so never offered this
        # operation — the gap that left the QStash schedule firing into a dispatcher with nothing
        # to claim.
        #
        # ORDER: this must run BEFORE the universe seed, not after. `seedUniverse` requires an
        # active `config_version` row — "a universe version references the configuration it was
        # selected under; seeding without one leaves every artifact unable to say what it was
        # computed against" — and this script is what bootstraps that row. Running the universe
        # seed first fails with exactly that message on a fresh database, which is how this
        # dependency was found. It is a side effect rather than a declared prerequisite, so it is
        # written down here: do not reorder these two steps.
        #
        # Idempotent per job_key (`on conflict do nothing`), deliberately *not* all-or-nothing
        # like the universe seed: substack.collect is seeded disabled until a handler exists, and
        # re-running this after that handler lands must not overwrite rows whose next_due_at the
        # dispatcher has already advanced.
        run: pnpm seed:jobs
      - name: Seed universe
        if: inputs.operation == 'seed-universe' || inputs.operation == 'migrate-then-seed-all'
        working-directory: apps/web
        # Runs AFTER the job-definition seed, which bootstraps the active `config_version` this
        # step requires — see that step's own note.
        #
        # Also idempotent, and deliberately more than that: it refuses to reinsert a symbol an
        # administrator removed, so re-running it can never resurrect a deleted member.
        env:
          APP_ENVIRONMENT: ${{ inputs.environment }}
        run: pnpm seed:universe


